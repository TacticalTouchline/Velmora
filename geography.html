<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Geography — The Republic of Velmora</title>
  <meta name="description" content="An explorable 3D terrain map of Velmora, built from the nation's own painted map." />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Lato:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/map.css" />
  <link rel="stylesheet" href="css/geography.css" />
</head>
<body>
  <div class="container mx-auto px-4 py-8 md:py-12">

    <!-- Nav -->
    <div id="site-nav"></div>

    <!-- Header -->
    <header class="text-center mb-10">
      <h1 class="text-4xl md:text-6xl font-bold text-white tracking-wider">Geography</h1>
      <p class="text-lg text-amber-300 mt-2">Velmora, as the ground actually sits.</p>
    </header>

    <main>
      <div id="geo-stage" class="geo-stage border border-amber-900 shadow-2xl shadow-blue-900/50">
        <div id="geo-canvas-container"></div>
        <div id="geo-markers-layer" style="position:absolute; inset:0; z-index:2; pointer-events:none;"></div>

        <div class="geo-overlay-top">
          <span class="geo-chip">Drag to orbit · scroll to zoom</span>
          <div class="geo-controls">
            <button type="button" id="geo-toggle-regions" class="geo-btn" aria-pressed="true">Regions</button>
            <button type="button" id="geo-toggle-clubs" class="geo-btn" aria-pressed="true">Clubs</button>
            <button type="button" id="geo-reset" class="geo-btn">Reset view</button>
          </div>
        </div>

        <!-- Region quick-jump, under the drag/zoom hint chip -->
        <nav class="geo-legend-overlay" aria-label="Jump to a region">
          <button type="button" class="map-legend-btn" data-fly-region="northern-highlands"><span class="dot" style="background:#e6eff0"></span>Northern Highlands</button>
          <button type="button" class="map-legend-btn is-mystery" data-fly-region="northern-bay"><span class="dot"></span>Northern Bay</button>
          <button type="button" class="map-legend-btn" data-fly-region="western-plateau"><span class="dot" style="background:#9d714c"></span>Western Plateau</button>
          <button type="button" class="map-legend-btn" data-fly-region="central-velmora"><span class="dot" style="background:#f8be36"></span>Central Velmora</button>
          <button type="button" class="map-legend-btn" data-fly-region="eastern-reaches"><span class="dot" style="background:#6e9844"></span>Eastern Reaches</button>
          <button type="button" class="map-legend-btn" data-fly-region="southern-lakes"><span class="dot" style="background:#519ecc"></span>Southern Lakes</button>
        </nav>

        <!-- Region/club info: floats over the map, closable -->
        <div id="geo-panel" class="geo-panel is-hidden">
          <button type="button" id="geo-panel-close" class="geo-panel-close" aria-label="Close">&times;</button>
          <div id="geo-panel-body"></div>
        </div>

        <div id="geo-loading" class="geo-loading">
          <div class="geo-spinner" aria-hidden="true"></div>
          <span>Raising the terrain…</span>
        </div>
      </div>

      <div id="geo-fallback" class="geo-fallback">
        <p>Your browser can't run the 3D terrain here (WebGL isn't available).</p>
        <p class="mt-2">The <a href="index.html">flat regional map</a> covers the same ground.</p>
      </div>
    </main>

    <!-- Footer -->
    <footer class="text-center mt-12 py-4 border-t border-gray-800">
      <p class="text-gray-500">&copy; 2026 Republic of Velmora. All rights reserved.</p>
    </footer>

  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script type="module">
    import { renderNav, wireNav } from './js/siteNav.js';
    document.getElementById('site-nav').innerHTML = renderNav('geography');
    wireNav();
  </script>
  <script type="module" src="js/geography.js"></script>
</body>
</html>
