<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Republic of Velmora</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Lato:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="container mx-auto px-4 py-8 md:py-12">
    <!-- Header -->
    <header class="text-center mb-10">
      <h1 class="text-4xl md:text-6xl font-bold text-white tracking-wider">The Republic of Velmora</h1>
      <p class="text-lg text-amber-300 mt-2">Discipline, Craftsmanship, Strategic Thinking</p>
    </header>

    <!-- Main Content -->
    <main class="grid grid-cols-1 lg:grid-cols-5 gap-8">
      <!-- Map Column -->
        <div class="lg:col-span-3">
            <div class="map-container border border-amber-900 shadow-2xl shadow-blue-900/50">
                <div id="svg-container" class="map-container border border-amber-900 shadow-2xl shadow-blue-900/50"></div>
            </div>
        </div>

        <!-- Details Panel -->
        <div id="region-details-panel-placeholder" class="lg:col-span-2 bg-blue-900/20 p-6 rounded-lg border border-gray-700 h-fit">
          <h2 id="region-name" class="text-3xl font-bold text-amber-400 transition-all duration-300">Select a Region</h2>
          <div class="w-16 h-1 bg-amber-400 my-4 rounded-full"></div>
          <p id="region-description" class="text-gray-300 leading-relaxed mb-6">
            Click on any region on the map to discover its unique characteristics, footballing culture, and major cities.
          </p>
        </div>


    </main>

    <!-- Footer -->
    <footer class="text-center mt-12 py-4 border-t border-gray-800">
      <p class="text-gray-500">&copy; 2024 Republic of Velmora. All rights reserved.</p>
    </footer>
  </div>

  <!-- JavaScript modules -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
