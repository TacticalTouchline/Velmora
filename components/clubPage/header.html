<!-- components/clubpage/header.html -->
<section id="club-header" class="relative rounded-xl overflow-hidden shadow-lg text-white" style="background: var(--club-color-primary);">
  <div class="flex items-center justify-between p-6 backdrop-blur-sm bg-black/40">
    <div class="flex space-x-6 items-center">
      <img id="club-logo" class="h-auto w-20" alt="Club Logo" />
      <div>
        <h1 id="club-name" class="text-3xl font-extrabold tracking-wide uppercase" style="color: var(--club-color-secondary);">Club Name</h1>
        <p id="club-nickname" class="text-sm italic opacity-80">Club Nickname</p>
      </div>
    </div>
    <p id="club-chant" class="hidden md:block text-sm italic opacity-80 whitespace-pre text-right">Club Chant</p>
  </div>
  <div id="club-color-bar" class="h-2 w-full"></div>
</section>
